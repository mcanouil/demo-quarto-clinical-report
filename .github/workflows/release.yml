name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, `YYYY.MM.DD` by default"
        required: false
        type: string

permissions:
  contents: read

# Serialise releases and never cancel one in flight: stopping midway could
# leave the bump on `main` with no tag and no release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Bump the version and create the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    steps:
      - name: Get the token
        id: token
        uses: mcanouil/release-actions/token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          app-key: ${{ secrets.APP_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.token.outputs.token }}
          persist-credentials: true

      # Release what the render workflow has already built and checked, rather
      # than installing the R packages and rendering both profiles a second time.
      - name: Check that the render succeeded for this commit
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          CONCLUSION=$(gh run list \
            --workflow "Render" \
            --branch "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // "none"')
          if [ "${CONCLUSION}" != "success" ]; then
            echo "::error::The last render of ${GITHUB_SHA} is '${CONCLUSION}'; release a commit that renders."
            exit 1
          fi

      # An explicit version also sets the release date, so `2026.09.01` is
      # dated 2026-09-01. Without one, the bump uses today.
      - name: Resolve the release date
        id: date
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION}" && ! "${INPUT_VERSION}" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?$ ]]; then
            echo "::error::Version must be YYYY.MM.DD or YYYY.MM.DD-N, not '${INPUT_VERSION}'."
            exit 1
          fi
          CORE="${INPUT_VERSION%%-*}"
          DATE="${CORE//./-}"
          if [[ -n "${DATE}" && "$(date -u -d "${DATE}" +%Y-%m-%d 2>/dev/null || true)" != "${DATE}" ]]; then
            echo "::error::Version '${INPUT_VERSION}' is not a calendar date."
            exit 1
          fi
          echo "date=${DATE}" >> "${GITHUB_OUTPUT}"

      # The version is the date, so a release says when the report was built
      # rather than claiming a semantic version the project does not carry. A
      # second release on the same day becomes `YYYY.MM.DD-2`.
      # `_metadata-csr.yml` is deliberately untouched: `report-version` and
      # `report-date` belong to the fictional study report, not to this project.
      - name: Bump the version and roll the changelog
        id: bump
        uses: mcanouil/release-actions/bump@v1
        with:
          bump: ${{ inputs.version || 'calver' }}
          date: ${{ steps.date.outputs.date }}
          changelog-heading: "## [{version}] - {date}"
          token: ${{ steps.token.outputs.token }}
          targets: |
            - file: rproj.toml
              pattern: '^version = "{version}"$'
              source: true
            - file: CITATION.cff
              pattern: '^version: "{version}"$'
            - file: CITATION.cff
              pattern: '^date-released: "{date}"$'

      # A message without `[skip ci]`, so the render workflow publishes the
      # bumped version.
      - name: Land the bump
        id: land
        uses: mcanouil/release-actions/land@v1
        with:
          mode: push
          files: ${{ steps.bump.outputs.files }}
          version: ${{ steps.bump.outputs.version }}
          message: "chore(release): ${{ steps.bump.outputs.version }}"
          token: ${{ steps.token.outputs.token }}

      - name: Compose the release body
        id: notes
        uses: mcanouil/release-actions/notes@v1
        with:
          notes-file: ${{ steps.bump.outputs.notes-file }}
          section-heading: ""

      - name: Create the release
        uses: mcanouil/release-actions/release@v1
        with:
          version: ${{ steps.bump.outputs.version }}
          body-file: ${{ steps.notes.outputs.body-file }}
          # A later release on the same day is titled by its version, such as
          # `2026.10.16-2`, so it stands apart from the first.
          title: ${{ contains(steps.bump.outputs.version, '-') && '{version}' || '{date}' }}
          date: ${{ steps.bump.outputs.date }}
          target: ${{ steps.land.outputs.sha }}
          token: ${{ steps.token.outputs.token }}

      - name: Explain the recovery
        if: ${{ failure() && steps.land.outputs.sha != '' }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          SHA: ${{ steps.land.outputs.sha }}
        run: |
          echo "::error::${GITHUB_REF_NAME} holds the bump ${SHA} for ${VERSION}, but the release failed. Create release ${VERSION} on ${SHA} by hand, or revert that commit with a pull request and run this workflow again."
