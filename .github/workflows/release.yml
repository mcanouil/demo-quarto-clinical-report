name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, `YYYY.MM.DD` by default"
        required: false
        type: string

permissions:
  contents: read

# Serialise releases and never cancel one in flight: stopping midway could
# leave the bump on `main` with no tag and no release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Bump the version and create the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Configure Environment for Git User
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          USER_ID: ${{ steps.get-user-id.outputs.user-id }}
        run: |
          set -euo pipefail
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      # Release what the render workflow has already built and checked, rather
      # than restoring `renv` and rendering both profiles a second time.
      - name: Check that the render succeeded for this commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          CONCLUSION=$(gh run list \
            --workflow "Render" \
            --branch "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --limit 1 \
            --json conclusion \
            --jq '.[0].conclusion // "none"')
          if [ "${CONCLUSION}" != "success" ]; then
            echo "::error::The last render of ${GITHUB_SHA} is '${CONCLUSION}'; release a commit that renders."
            exit 1
          fi

      # An explicit version also sets the release date, so `2026.09.01` is
      # dated 2026-09-01. Without one, the bump uses today.
      - name: Resolve the release date
        id: date
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          CORE="${INPUT_VERSION%%-*}"
          echo "date=${CORE//./-}" >> "${GITHUB_OUTPUT}"

      # The version is the date, so a release says when the report was built
      # rather than claiming a semantic version the project does not carry. A
      # second release on the same day becomes `YYYY.MM.DD-2`.
      # `_metadata-csr.yml` is deliberately untouched: `report-version` and
      # `report-date` belong to the fictional study report, not to this project.
      - name: Bump the version and roll the changelog
        id: bump
        uses: mcanouil/release-actions/bump@v1
        with:
          bump: ${{ inputs.version || 'calver' }}
          date: ${{ steps.date.outputs.date }}
          changelog-heading: "## [{version}] - {date}"
          targets: |
            - file: DESCRIPTION
              pattern: '^Version: {version}$'
              source: true
            - file: CITATION.cff
              pattern: '^version: "{version}"$'
            - file: CITATION.cff
              pattern: '^date-released: "{date}"$'

      # The release step refuses an existing tag too, but only after the push,
      # which would leave the bump on `main`.
      - name: Refuse an existing tag or release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          STATUS=0
          git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null || STATUS=$?
          case "${STATUS}" in
            0) echo "::error::Tag ${VERSION} exists already."; exit 1 ;;
            2) ;;
            *) echo "::error::Could not list the tags of origin (git exit ${STATUS})."; exit 1 ;;
          esac
          if OUTPUT=$(gh release view "${VERSION}" 2>&1); then
            echo "::error::A release ${VERSION} exists already, perhaps as a draft."
            exit 1
          fi
          if [ "${OUTPUT}" != "release not found" ]; then
            echo "::error::Could not check for release ${VERSION}: ${OUTPUT}"
            exit 1
          fi

      - name: Commit and push the bump
        id: push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          FILES: ${{ steps.bump.outputs.files }}
        run: |
          set -euo pipefail
          printf '%s\n' "${FILES}" | git add --pathspec-from-file=-
          git commit -m "chore(release): ${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Compose the release body
        id: notes
        uses: mcanouil/release-actions/notes@v1
        with:
          notes-file: ${{ steps.bump.outputs.notes-file }}
          section-heading: ""

      - name: Create the release
        uses: mcanouil/release-actions/release@v1
        with:
          version: ${{ steps.bump.outputs.version }}
          body-file: ${{ steps.notes.outputs.body-file }}
          title: "{date}"
          date: ${{ steps.bump.outputs.date }}
          target: ${{ steps.push.outputs.sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Explain the recovery
        if: ${{ failure() && steps.push.outputs.sha != '' }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          SHA: ${{ steps.push.outputs.sha }}
        run: |
          echo "::error::${GITHUB_REF_NAME} holds the bump ${SHA} for ${VERSION}, but the release failed. Create release ${VERSION} on ${SHA} by hand, or revert that commit with a pull request and run this workflow again."
