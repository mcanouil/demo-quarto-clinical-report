name: Render

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft != true }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: pre-release

      - name: Install system libraries for the text and graphics stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libtiff-dev libjpeg-dev

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Restore R packages
        uses: r-lib/actions/setup-renv@v2

      - name: Build the analysis datasets
        run: Rscript R/00-adam.R

      - name: Check the analysis results
        run: Rscript -e 'testthat::test_dir("tests/testthat")'

      - name: Render book
        run: quarto render --profile book

      - name: Render single document
        run: quarto render --profile doc

      - name: Add the single document to the site
        run: |
          mkdir -p _book/single
          cp -R _doc/. _book/single/

      - name: Upload the report
        uses: actions/upload-artifact@v7
        with:
          name: clinical-study-report
          path: |
            _book/Clinical-Study-Report.pdf
            _doc/Clinical-Study-Report.pdf
            _doc/Statistical-Analysis-Plan.pdf

      - name: Upload the site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _book

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
